[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-coverage-analyzer"
version = "0.1.0"
description = "Offline-friendly Wazuh and MITRE ATT&CK SOC coverage analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
ai = ["anthropic>=0.30"]
dev = ["pytest>=8.0"]

[project.scripts]
soc-coverage = "soc_coverage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
